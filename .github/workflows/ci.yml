name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: 无密钥检查（源码内不得出现硬编码密钥）
        # 只扫源码与 CI 配置：文档（docs/*.md、*.example）里出现的是占位符，不算硬编码密钥
        run: |
          if grep -RInE '(QQ_BOT_APP_SECRET|MC_RCON_PASSWORD)[[:space:]]*=[[:space:]]*[^[:space:]]' \
              --include='*.py' --include='*.yml' --include='*.toml' src tests .github ; then
            echo "::error::检测到硬编码密钥"; exit 1
          fi

      - name: Lint (ruff)
        run: ruff check src tests

      - name: 测试 (pytest)
        run: pytest -q --cov=y33bot --cov-report=term-missing --cov-fail-under=70
        env:
          # 测试全程离线：不设置任何 QQ / RCON 真实凭据
          PYTHONHASHSEED: "0"
